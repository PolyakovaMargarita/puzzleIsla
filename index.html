<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Puzzle Isle</title>
  <meta name="description" content="Puzzle Isle — match-3 and island restoration. Privacy and support." />
  <style>
    :root {
      --ink: #143B4A;
      --muted: #5D7B86;
      --cream: #FFF8E8;
      --aqua-dark: #159EAA;
      --sky: #BCECF4;
      --ocean: #168FB3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 90% 60% at 10% -10%, #FFE08A 0%, transparent 55%),
        radial-gradient(ellipse 80% 50% at 100% 0%, var(--sky) 0%, transparent 50%),
        linear-gradient(180deg, #DDF7F1 0%, var(--cream) 45%, #E8F7FB 100%);
      min-height: 100vh;
      line-height: 1.55;
    }
    main { max-width: 640px; margin: 0 auto; padding: 40px 22px 64px; }
    .brand {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--aqua-dark);
      margin: 0 0 8px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 6vw, 2.6rem);
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .tagline { margin: 0 0 28px; color: var(--muted); font-weight: 600; }
    .card {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 10px 28px rgba(16, 74, 90, 0.1);
    }
    h2 { margin: 0 0 10px; font-size: 1.05rem; }
    p { margin: 0 0 10px; }
    p:last-child { margin-bottom: 0; }
    a {
      color: var(--ocean);
      font-weight: 700;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 3px;
    }
    nav a { display: inline-block; margin-right: 16px; margin-top: 6px; }
    footer { margin-top: 28px; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Puzzle Isle</p>
    <h1>Puzzle Isle</h1>
    <p class="tagline">Match-3 puzzles and dream island restoration — for iOS and Android.</p>

    <section class="card">
      <h2>Official pages</h2>
      <p>Use these links in App Store Connect and Google Play Console.</p>
      <nav>
        <a href="./privacy.html">Privacy Policy</a>
        <a href="./support.html">Support</a>
      </nav>
    </section>

    <section class="card">
      <h2>Contact</h2>
      <p><a href="mailto:margaritka251289@gmail.com?subject=Puzzle%20Isle">margaritka251289@gmail.com</a></p>
    </section>

    <footer>
      Developer: Margarita Polyakova<br />
      Last updated: 14 October 2026
    </footer>
  </main>
</body>
</html>
